[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.20"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
[etherscan]
aia-testnet = { key = "${AIASCAN_API_KEY}", url = "https://testnet.aiascan.com/api/v2" }
aia-mainnet = { key = "${AIASCAN_API_KEY}", url = "https://www.aiascan.com/api/v2" }
